server:
  port: 8080

agent-service:
  url: ${AGENT_SERVICE_URL:http://localhost:8001}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agentic_studio?options=-c%20timezone=UTC
    username: agentic
    password: agentic
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true