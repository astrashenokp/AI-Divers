server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agentic_studio?options=-c%20timezone=UTC
    username: agentic
    password: agentic
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: update
    show-sql: true