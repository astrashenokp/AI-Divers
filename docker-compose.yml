services:
  postgres:
    image: postgres:16
    container_name: agentic-studio-postgres
    environment:
      POSTGRES_DB: agentic_studio
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: