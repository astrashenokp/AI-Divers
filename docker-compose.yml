services:
  postgres:
    image: postgres:16
    container_name: agentic-studio-postgres
    environment:
      POSTGRES_DB: agentic_studio
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  agent-service:
    build:
      context: ./apps/agent-service
      dockerfile: Dockerfile
    container_name: agentic-studio-agent-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: agentic-studio-backend
    depends_on:
      - postgres
      - agent-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentic_studio?options=-c%20timezone=UTC
      SPRING_DATASOURCE_USERNAME: agentic
      SPRING_DATASOURCE_PASSWORD: agentic
      AGENT_SERVICE_URL: http://agent-service:8001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_USE_MOCK_API: "false"
    container_name: agentic-studio-web
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_USE_MOCK_API: "false"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
